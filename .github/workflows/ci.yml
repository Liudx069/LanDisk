name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/LanDisk.Web/package-lock.json

      - name: Build web frontend
        working-directory: src/LanDisk.Web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build solution
        run: dotnet build LanDisk.slnx -c Release --nologo

      - name: Test
        run: dotnet test tests/LanDisk.Tests/LanDisk.Tests.csproj -c Release --no-build --nologo --logger "trx;LogFileName=test.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/LanDisk.Tests/TestResults/*.trx
          if-no-files-found: ignore
