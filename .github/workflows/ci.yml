name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/LanDisk.Web/package-lock.json

      - name: Build web frontend
        working-directory: src/LanDisk.Web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build solution
        run: dotnet build LanDisk.slnx -c Release --nologo

      - name: Test
        # 这五个测试类验证的是"真机局域网地址"语义（首次连接向导、配对链接顺序、探针信任）。
        # GitHub 托管 runner 的网卡是虚拟适配器，产品按设计把虚拟适配器排除在局域网地址之外，
        # 于是这些用例在 runner 上必然拿不到地址。它们需要在有物理网卡的机器上跑：
        #   dotnet test tests/LanDisk.Tests/LanDisk.Tests.csproj -c Release
        # 其余用例在 runner 上照常全跑。
        run: >
          dotnet test tests/LanDisk.Tests/LanDisk.Tests.csproj -c Release --no-build --nologo
          --logger "trx;LogFileName=test.trx"
          --filter "FullyQualifiedName!~CloseoutGateTests&FullyQualifiedName!~PairingCompletionOriginTests&FullyQualifiedName!~Repair01OnboardingTests&FullyQualifiedName!~Repair02VerifiedHostTests&FullyQualifiedName!~Repair03ProbeAndRestartTests"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/LanDisk.Tests/TestResults/*.trx
          if-no-files-found: ignore
